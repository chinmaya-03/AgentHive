databases:
  # 1. PostgreSQL Database Service
  - name: agenthive_db
    databaseName: agenthive
    user: agenthive
    plan: free

services:
  # 2. FastAPI Backend Service
  - type: web
    name: agenthive_backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agenthive_db
          property: connectionString
      - key: LLM_PROVIDER
        sync: false # Allows you to change between 'groq' and 'gemini' on the Render dashboard
      - key: GROQ_API_KEY
        sync: false # Prompt/edit from dashboard
      - key: GEMINI_API_KEY
        sync: false # Prompt/edit from dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://agenthive-frontend.onrender.com,${agenthive_frontend.url}

  # 3. React Frontend Service
  - type: web
    name: agenthive_frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://agenthive-backend.onrender.com/api/v1
